name: Deploy site

# The live site is the static folder public/.
# The page public/index.html is built locally by site-options/build_final.py.
# The old al-folio theme files stay in this repository but are not deployed.

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy public/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
